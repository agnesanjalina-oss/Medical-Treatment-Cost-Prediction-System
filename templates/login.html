<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Medical Treatment Cost Prediction System for Bangladesh Hospitals
    </title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        body {
            background: #eef3f8;
            font-family: Arial, sans-serif;
        }


        .login-container {
            width: 900px;
            max-width: 95%;
            margin: 100px auto;
        }


        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }


        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 25px;
        }


        .hospital-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }


        .btn-login {
            width: 100%;
        }


        .footer {
            text-align: center;
            margin-top: 20px;
            color: gray;
        }


        .form-control {
            padding: 12px;
        }


        .register-link {
            text-decoration: none;
            font-weight: bold;
        }


        .forgot-link {
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="card">


        <!-- HEADER -->

        <div class="card-header">

            <i class="fa-solid fa-hospital hospital-icon"></i>

            <h3>
                Medical Treatment Cost Prediction
            </h3>

            <p class="mb-0">
                Bangladesh Hospital System
            </p>

        </div>


        <!-- BODY -->

        <div class="card-body p-4">


            <form action="{{ url_for('login') }}"
                  method="POST">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required>

                </div>


                <!-- REMEMBER ME -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="remember"
                        name="remember">

                    <label
                        class="form-check-label"
                        for="remember">

                        Remember Me

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary btn-login">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


            </form>


            <hr>


            <!-- REGISTER -->

            <div class="text-center">

                <p>

                    Don't have an account?

                    <a
                        href="{{ url_for('register_page') }}"
                        class="register-link">

                        Register Here

                    </a>

                </p>


                <a
                    href="#"
                    class="forgot-link">

                    Forgot Password?

                </a>

            </div>


        </div>


    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 Medical Treatment Cost Prediction System

    </div>


</div>


</body>

</html>
