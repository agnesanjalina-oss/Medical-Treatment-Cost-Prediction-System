<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Register - Medical Treatment Cost Prediction System for Bangladesh Hospitals
    </title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        body {
            background: #eef3f8;
            font-family: Arial, sans-serif;
        }


        .register-container {
            width: 450px;
            max-width: 90%;
            margin: 60px auto;
        }


        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }


        .card-header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 20px;
        }


        .hospital-icon {
            font-size: 45px;
            margin-bottom: 8px;
        }


        .card-header h3 {
            font-size: 22px;
            margin-bottom: 8px;
        }


        .card-header p {
            font-size: 14px;
            margin-bottom: 3px;
        }


        .card-body {
            padding: 25px;
        }


        .form-control,
        .form-select {
            padding: 11px;
        }


        .btn-register {
            width: 100%;
            padding: 11px;
        }


        .footer {
            text-align: center;
            margin-top: 15px;
            color: gray;
            font-size: 14px;
        }


        .login-link {
            text-decoration: none;
            font-weight: bold;
        }


        @media (max-width: 500px) {

            .register-container {
                width: 95%;
                margin: 30px auto;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <div class="card">


        <!-- HEADER -->

        <div class="card-header">

            <i class="fa-solid fa-hospital hospital-icon"></i>

            <h3>
                Create Account
            </h3>

            <p>
                Medical Treatment Cost Prediction System
            </p>

            <p>
                For Bangladesh Hospitals
            </p>

        </div>


        <!-- BODY -->

        <div class="card-body">


            <form
                action="{{ url_for('register_page') }}"
                method="POST">


                <!-- FULL NAME -->

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        name="phone"
                        class="form-control"
                        placeholder="Enter phone number"
                        required>

                </div>


                <!-- USER TYPE -->

                <div class="mb-3">

                    <label class="form-label">
                        User Type
                    </label>

                    <select
                        class="form-select"
                        name="user_type"
                        required>

                        <option value="" selected disabled>
                            Select User Type
                        </option>

                        <option value="Patient">
                            Patient
                        </option>

                        <option value="Doctor">
                            Doctor
                        </option>

                        <option value="Hospital Staff">
                            Hospital Staff
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create password"
                        minlength="6"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Confirm password"
                        minlength="6"
                        required>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary btn-register">

                    <i class="fa-solid fa-user-plus"></i>

                    Register

                </button>


            </form>


            <hr>


            <!-- LOGIN -->

            <div class="text-center">

                <p class="mb-0">

                    Already have an account?

                    <a
                        href="{{ url_for('login_page') }}"
                        class="login-link">

                        Login Here

                    </a>

                </p>

            </div>


        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 Medical Treatment Cost Prediction System
        for Bangladesh Hospitals

    </div>


</div>


</body>

</html>
